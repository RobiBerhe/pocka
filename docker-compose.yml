version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pocka_user
      POSTGRES_PASSWORD: pocka_password
      POSTGRES_DB: pocka_db
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  bot:
    build: .
    ports:
      - "8989:8989"
    environment:
      - DATABASE_URL=postgres://pocka_user:pocka_password@db:5432/pocka_db?sslmode=disable
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - PORT=8989
      - ENVIRONMENT=production
      - AI_ENABLED=${AI_ENABLED}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
